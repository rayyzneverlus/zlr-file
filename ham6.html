<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FAREL AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --surface2: #18181f;
      --border: #ffffff12;
      --border2: #ffffff22;
      --accent: #7c6dfa;
      --accent2: #a78bfa;
      --accent3: #38bdf8;
      --text: #f0eeff;
      --muted: #7c7a96;
      --user-bg: #1e1b3a;
      --ai-bg: #111118;
      --glow: 0 0 40px #7c6dfa33;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      overflow: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 10%, #7c6dfa18 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 90%, #38bdf820 0%, transparent 60%),
        radial-gradient(ellipse 40% 60% at 50% 50%, #a78bfa08 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: bgPulse 8s ease-in-out infinite alternate;
    }

    @keyframes bgPulse {
      0% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    /* Grid overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
      mask-image: radial-gradient(ellipse at center, black 20%, transparent 80%);
    }

    #app {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 820px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent3));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 16px;
      color: #fff;
      box-shadow: 0 0 20px #7c6dfa55;
      flex-shrink: 0;
    }

    .logo-text {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--accent2), var(--accent3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo-sub {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .header-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border: 1px solid var(--border2);
      border-radius: 999px;
      font-size: 11px;
      color: var(--muted);
      background: var(--surface);
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 6px #4ade80;
      animation: blink 2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Chat area */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    /* Welcome screen */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 48px 0;
      text-align: center;
      gap: 16px;
      animation: fadeIn 0.6s ease;
    }

    .welcome-icon {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--accent), var(--accent3));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 28px;
      color: #fff;
      box-shadow: var(--glow);
      margin-bottom: 8px;
    }

    .welcome h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 32px;
      background: linear-gradient(90deg, var(--text), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
    }

    .welcome p {
      color: var(--muted);
      font-size: 13px;
      max-width: 360px;
      line-height: 1.7;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }

    .suggestion-btn {
      padding: 9px 18px;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 10px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .suggestion-btn:hover {
      border-color: var(--accent);
      color: var(--text);
      background: var(--surface2);
      box-shadow: 0 0 12px #7c6dfa22;
    }

    /* Messages */
    .message {
      display: flex;
      gap: 14px;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user { flex-direction: row-reverse; }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 13px;
      flex-shrink: 0;
    }

    .avatar.ai {
      background: linear-gradient(135deg, var(--accent), var(--accent3));
      color: #fff;
      box-shadow: 0 0 16px #7c6dfa33;
    }

    .avatar.user {
      background: var(--user-bg);
      border: 1px solid var(--border2);
      color: var(--accent2);
    }

    .bubble {
      max-width: 72%;
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 13.5px;
      line-height: 1.75;
      position: relative;
    }

    .message.ai .bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top-left-radius: 4px;
      color: var(--text);
    }

    .message.user .bubble {
      background: var(--user-bg);
      border: 1px solid #7c6dfa33;
      border-top-right-radius: 4px;
      color: var(--text);
    }

    .bubble-meta {
      font-size: 10px;
      color: var(--muted);
      margin-top: 6px;
      letter-spacing: 0.5px;
    }

    .message.user .bubble-meta { text-align: right; }

    /* Typing indicator */
    .typing-bubble {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 16px 20px;
    }

    .typing-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: typingBounce 1.2s infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 100% { transform: translateY(0); opacity: 0.4; }
      50% { transform: translateY(-5px); opacity: 1; }
    }

    /* Input area */
    footer {
      flex-shrink: 0;
      padding: 16px 0 24px;
      border-top: 1px solid var(--border);
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 16px;
      padding: 10px 10px 10px 18px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-row:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px #7c6dfa18;
    }

    #prompt {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 13.5px;
      line-height: 1.6;
      resize: none;
      max-height: 160px;
      min-height: 24px;
      overflow-y: auto;
    }

    #prompt::placeholder { color: var(--muted); }

    #prompt::-webkit-scrollbar { width: 3px; }
    #prompt::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    #sendBtn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent3));
      border: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
      box-shadow: 0 0 16px #7c6dfa44;
    }

    #sendBtn:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 0 24px #7c6dfa66;
    }

    #sendBtn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    #sendBtn svg { width: 17px; height: 17px; }

    .footer-note {
      text-align: center;
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 10px;
      letter-spacing: 0.5px;
    }

    .footer-note span {
      color: var(--accent2);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Scrollbar for chat */
    .message .bubble pre {
      background: #0a0a0f;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-top: 8px;
      overflow-x: auto;
      font-size: 12px;
      line-height: 1.6;
    }

    .message .bubble code {
      background: #0a0a0f;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 12px;
    }

    /* Error */
    .error-bubble {
      border-color: #f87171 !important;
      color: #fca5a5 !important;
    }

    @media (max-width: 600px) {
      .logo-text { font-size: 18px; }
      .bubble { max-width: 88%; font-size: 13px; }
      .welcome h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">
      <div class="logo-icon">F</div>
      <div>
        <div class="logo-text">FAREL AI</div>
        <div class="logo-sub">by Muhammad Farel</div>
      </div>
    </div>
    <div class="header-badge">
      <div class="badge-dot"></div>
      Online
    </div>
  </header>

  <div id="chat">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">F</div>
      <h1>Halo! Saya FAREL AI</h1>
      <p>Asisten AI cerdas yang siap membantu kamu. Tanyakan apa saja — saya siap menjawab dengan sepenuh hati.</p>
      <div class="suggestions">
        <button class="suggestion-btn" onclick="useSuggestion(this)">✦ Siapa kamu?</button>
        <button class="suggestion-btn" onclick="useSuggestion(this)">✦ Apa yang bisa kamu lakukan?</button>
        <button class="suggestion-btn" onclick="useSuggestion(this)">✦ Ceritakan lelucon lucu</button>
        <button class="suggestion-btn" onclick="useSuggestion(this)">✦ Bantu saya belajar coding</button>
      </div>
    </div>
  </div>

  <footer>
    <div class="input-row">
      <textarea id="prompt" placeholder="Ketik pesan..." rows="1"></textarea>
      <button id="sendBtn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    <div class="footer-note">FAREL AI · dibuat oleh <span>Muhammad Farel</span> · Model: UnlimitedAI Reasoning</div>
  </footer>
</div>

<script>
  const chatEl = document.getElementById('chat');
  const promptEl = document.getElementById('prompt');
  const sendBtn = document.getElementById('sendBtn');
  const welcomeEl = document.getElementById('welcome');

  // Auto-resize textarea
  promptEl.addEventListener('input', () => {
    promptEl.style.height = 'auto';
    promptEl.style.height = Math.min(promptEl.scrollHeight, 160) + 'px';
  });

  // Enter to send (Shift+Enter = newline)
  promptEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function useSuggestion(btn) {
    promptEl.value = btn.textContent.replace('✦ ', '');
    promptEl.focus();
    sendMessage();
  }

  function getTime() {
    return new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
  }

  function addMessage(role, text, isError = false) {
    if (welcomeEl) welcomeEl.style.display = 'none';

    const msg = document.createElement('div');
    msg.className = `message ${role}`;

    const avatarText = role === 'ai' ? 'F' : 'U';
    const avatarClass = role === 'ai' ? 'ai' : 'user';

    msg.innerHTML = `
      <div class="avatar ${avatarClass}">${avatarText}</div>
      <div>
        <div class="bubble${isError ? ' error-bubble' : ''}">${formatText(text)}</div>
        <div class="bubble-meta">${getTime()}</div>
      </div>
    `;

    chatEl.appendChild(msg);
    scrollToBottom();
    return msg;
  }

  function formatText(text) {
    // Basic markdown-ish formatting
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/\n/g, '<br>');
  }

  function showTyping() {
    if (welcomeEl) welcomeEl.style.display = 'none';

    const msg = document.createElement('div');
    msg.className = 'message ai';
    msg.id = 'typing-indicator';
    msg.innerHTML = `
      <div class="avatar ai">F</div>
      <div>
        <div class="bubble">
          <div class="typing-bubble">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>
      </div>
    `;
    chatEl.appendChild(msg);
    scrollToBottom();
  }

  function removeTyping() {
    const t = document.getElementById('typing-indicator');
    if (t) t.remove();
  }

  function scrollToBottom() {
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  async function sendMessage() {
    const text = promptEl.value.trim();
    if (!text) return;

    promptEl.value = '';
    promptEl.style.height = 'auto';
    sendBtn.disabled = true;

    addMessage('user', text);
    showTyping();

    try {
      const url = `https://farel.eu.cc/api/unlimited?prompt=${encodeURIComponent(text)}`;
      const res = await fetch(url);

      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const data = await res.json();

      removeTyping();

      if (data.status && data.answer) {
        // Replace "UnlimitedAI" references with "FAREL AI"
        let answer = data.answer
          .replace(/UnlimitedAI\.Chat/gi, 'FAREL AI')
          .replace(/UnlimitedAI/gi, 'FAREL AI')
          .replace(/Unlimited AI/gi, 'FAREL AI');

        addMessage('ai', answer);
      } else {
        throw new Error('Respons tidak valid dari server.');
      }
    } catch (err) {
      removeTyping();
      addMessage('ai', `⚠️ Gagal terhubung ke server: ${err.message}. Silakan coba lagi.`, true);
    } finally {
      sendBtn.disabled = false;
      promptEl.focus();
    }
  }
</script>
</body>
</html>
